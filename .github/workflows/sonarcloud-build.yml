name: "SonarQube Cloud - Build"

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SONAR_PROJECT_KEY: umbraco_Umbraco-CMS
  SONAR_ORGANIZATION: umbraco

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and collect analysis data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v5

      - name: Install tools
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage

      - name: Load sonar params
        run: |
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "SONARQUBE_SCANNER_PARAMS=$(git show origin/main:.github/workflows/sonarcloud/sonar-params.json | jq -c .)" >> $GITHUB_ENV
          else
            echo "SONARQUBE_SCANNER_PARAMS=$(jq -c . .github/workflows/sonarcloud/sonar-params.json)" >> $GITHUB_ENV
          fi

      - name: Begin analysis
        run: |
          dotnet-sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION"

      - name: Restore
        run: dotnet restore umbraco.sln

      - name: Build solution
        run: dotnet build umbraco.sln --no-restore -clp:ErrorsOnly

      - name: Run unit tests with coverage
        run: |
          dotnet-coverage collect \
            "dotnet test tests/Umbraco.Tests.UnitTests/Umbraco.Tests.UnitTests.csproj --no-build" \
            --output TestResults/coverage.xml \
            --output-format xml

      - name: Upload analysis data
        uses: actions/upload-artifact@v7
        with:
          name: analysis-data
          include-hidden-files: true
          path: |
            .sonarqube/
            TestResults/
          retention-days: 1
